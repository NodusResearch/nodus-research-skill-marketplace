name: Validate marketplace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate packages and catalog freshness
        run: node scripts/catalog.mjs --check
      - name: Validate templates
        run: node scripts/validate-templates.mjs
      - name: Generated artifacts are unmodified
        run: |
          if ! head -1 scripts/contract.mjs | grep -q 'GENERATED by Nodus'; then
            echo "scripts/contract.mjs lost its generated-file banner; regenerate it from the application." >&2
            exit 1
          fi
          if ! git diff --quiet -- scripts/contract.mjs; then
            echo "scripts/contract.mjs was modified by the build; it must be committed exactly as generated." >&2
            exit 1
          fi
