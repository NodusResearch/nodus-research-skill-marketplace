name: Validate marketplace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate packages and catalog freshness
        run: node scripts/catalog.mjs --check
      - name: Validate templates
        run: node scripts/validate-templates.mjs
      - name: Install build dependencies
        run: npm ci
      - name: Validate capability packages
        run: node scripts/validate-plugins.mjs
      - name: Capability package tests
        run: npm run test:plugins
      # Every pull request builds the packages, and never signs them: the signing key
      # lives in a protected environment the release workflow alone can reach.
      - name: Build capability packages
        run: node scripts/build-plugins.mjs
      - name: Builds are reproducible
        run: |
          cp build/index.json build/index.first.json
          node scripts/build-plugins.mjs
          if ! diff -q build/index.first.json build/index.json; then
            echo "A second build produced different bytes; the package build is not reproducible." >&2
            diff build/index.first.json build/index.json || true
            exit 1
          fi
      - name: Catalog is up to date
        run: node scripts/build-catalog-v2.mjs --check
      - name: Generated artifacts are unmodified
        run: |
          if ! head -1 scripts/contract.mjs | grep -q 'GENERATED by Nodus'; then
            echo "scripts/contract.mjs lost its generated-file banner; regenerate it from the application." >&2
            exit 1
          fi
          if ! git diff --quiet -- scripts/contract.mjs scripts/contract-v2.mjs; then
            echo "A generated contract was modified by the build; both must be committed exactly as generated." >&2
            exit 1
          fi
          if ! head -1 scripts/contract-v2.mjs | grep -q 'GENERATED by Nodus'; then
            echo "scripts/contract-v2.mjs lost its generated-file banner; regenerate it from the application." >&2
            exit 1
          fi
