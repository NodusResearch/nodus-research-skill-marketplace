name: Release capability package

# A reviewed main merge plus successful main CI authorizes publication. PR runs are
# never inputs to signing. Build and sign have separate tokens and environments.
on:
  workflow_run:
    workflows: [Validate marketplace]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      plugin:
        description: Optional package id; empty resumes all unpublished versions and catalog synchronization
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plugins: ${{ steps.plan.outputs.plugins }}
      pending: ${{ steps.plan.outputs.pending }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_PLUGIN: ${{ inputs.plugin }}
        run: node scripts/plan-capability-release.mjs

  build:
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_PLUGIN: ${{ matrix.plugin }}
      NODUS_CHEMISTRY_TEST_PYTHON: ${{ matrix.plugin == 'chemistry-studio' && 'python' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/setup-python@v6
        if: matrix.plugin == 'chemistry-studio'
        with:
          python-version: '3.13'
      - if: matrix.plugin == 'chemistry-studio'
        run: python -m pip install -r scripts/chemistry-test-requirements.txt
      - name: Generate third-party notices before packaging
        shell: bash
        run: node scripts/build-notices.mjs "$RELEASE_PLUGIN"
      - name: Validate every package
        run: node scripts/validate-plugins.mjs
      - name: Test the package
        shell: bash
        run: node --test plugins/"$RELEASE_PLUGIN"/test/*.test.mjs
      - name: Deterministic chemistry Python regressions
        if: matrix.plugin == 'chemistry-studio'
        run: node scripts/test-chemistry-python.mjs
      - name: Build the declared target
        shell: bash
        env:
          NODUS_PLUGIN_TARGET: ${{ matrix.target }}
        run: node scripts/build-plugins.mjs "$RELEASE_PLUGIN"
      - name: The build is reproducible on this machine
        shell: bash
        env:
          NODUS_PLUGIN_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cp "build/index-$NODUS_PLUGIN_TARGET.json" /tmp/first.json
          node scripts/build-plugins.mjs "$RELEASE_PLUGIN"
          diff /tmp/first.json "build/index-$NODUS_PLUGIN_TARGET.json"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.plugin }}-${{ matrix.target }}
          path: |
            build/index-${{ matrix.target }}.json
            build/${{ matrix.plugin }}-${{ matrix.version }}-${{ matrix.target }}.nodus-plugin
          if-no-files-found: error
          retention-days: 1

  # The only job that can reach the key builds nothing. It signs locally produced,
  # reproducible archives from the exact main commit whose validation succeeded.
  sign:
    needs: [plan, build]
    if: needs.plan.outputs.pending == 'true'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.plugins) }}
    runs-on: ubuntu-latest
    environment: capability-signing
    permissions:
      contents: write
    env:
      RELEASE_PLUGIN: ${{ matrix.plugin }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: package-${{ matrix.plugin }}-*
          path: build
          merge-multiple: true
      - name: Collect every declared target
        shell: bash
        run: node scripts/collect-release.mjs "$RELEASE_PLUGIN"
      - name: Sign the release manifest
        shell: bash
        env:
          CAPABILITY_SIGNING_KEY: ${{ secrets.CAPABILITY_SIGNING_KEY }}
        run: node scripts/sign-release.mjs "$RELEASE_PLUGIN"
      - name: Verify the signature the way Nodus will
        shell: bash
        run: node scripts/verify-release.mjs "$RELEASE_PLUGIN"
      - name: Publish every asset at the tested source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-capability-release.mjs "$RELEASE_PLUGIN"

  catalog:
    needs: [plan, build, sign]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.pending == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.sign.result == 'success' || needs.sign.result == 'failure' ||
       needs.plan.outputs.pending == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify published signatures and merge a checked metadata PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-published-catalog.mjs

  report-failure:
    needs: [plan, build, sign, catalog]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.plan.result == 'failure' || needs.build.result == 'failure' ||
       needs.sign.result == 'failure' || needs.catalog.result == 'failure' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Reporting executes reviewed default-branch code, never failed PR artifacts.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Report the failed run to the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/report-release-failure.mjs
